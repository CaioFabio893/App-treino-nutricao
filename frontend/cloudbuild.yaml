# Build de producao do frontend (Next.js standalone) -> Cloud Run.
# As variaveis NEXT_PUBLIC_* sao PUBLICAS (config do Firebase Client Web) e
# sao embutidas no bundle durante o build. Nunca passe secrets aqui.
#
# Executar a partir da raiz deste repo:
#   gcloud builds submit frontend \
#     --config frontend/cloudbuild.yaml \
#     --substitutions ^:^_API_URL=https://...:_API_KEY=...:_AUTH_DOMAIN=...:_FIREBASE_PROJECT_ID=...:_STORAGE_BUCKET=...:_SENDER_ID=...:_APP_ID=...
#
# Regiao do repositorio de imagem: southamerica-east1 (mesma da API Go).
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--tag"
      - "southamerica-east1-docker.pkg.dev/${PROJECT_ID}/treino-web/treino-web:latest"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_API_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_API_KEY=${_API_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_AUTH_DOMAIN}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_STORAGE_BUCKET}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_SENDER_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_APP_ID=${_APP_ID}"
      - "."
images:
  - "southamerica-east1-docker.pkg.dev/${PROJECT_ID}/treino-web/treino-web:latest"